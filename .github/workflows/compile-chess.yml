# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Build Chess

on:
  push:
    branches: [ "princess" ]
  pull_request:
    branches: [ "princess" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            pycmd: python3.11
            static_libpython: yes
            artifact_name: YuriChess-linux.bin
          - os: macos-latest
            pycmd: python3.11
            artifact_name: YuriChess-mac.bin
            static_libpython: yes
          - os: windows-latest
            pycmd: python3.exe
            static_libpython: no
            artifact_name: YuriChess-win.exe

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -U nuitka
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      shell: bash
    - name: Compile with Nuitka
      run: |
        ${{ matrix.pycmd }} -m nuitka --static-libpython=${{ matrix.static_libpython }} --lto=yes --assume-yes-for-downloads --standalone --onefile main.py --output-filename=${{ matrix.artifact_name }}
    - name: Test built chess.
      run: ./${{ matrix.artifact_name }} < tests/uci_test.txt
      shell: bash
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4.3.1
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}
        if-no-files-found: error
        compression-level: 9
          
